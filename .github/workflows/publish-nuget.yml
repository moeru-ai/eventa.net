name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish NuGet package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Eventa.slnx --locked-mode

      - name: Build
        run: dotnet build Eventa.slnx --configuration Release --no-restore

      - name: Pack packages
        run: dotnet pack Eventa.slnx --configuration Release --no-build -o artifacts/package

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push Eventa package
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet nuget push "artifacts/package/Eventa.$version.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
